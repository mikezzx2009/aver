# Disabled installation template for public static agent deliverables.
# The operator enables it separately after configuring site_base_url.
# Replace 203.0.113.10 with the host from that configured public origin.
# Use a separate origin from the authenticated application (domain setting).
# This IP origin never forwards requests to the private Aver application.
server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Nginx normalizes/decodes paths before matching these locations.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* (^|/)(node_modules|package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?)(/|$) {
        return 404;
    }

    location ~* \.(py|pyc|sh|sqlite|sqlite3|db|log|pem|key|toml|yaml|yml|ini|conf)(/|$) {
        return 404;
    }

    location /sites/ {
        # Only immutable publisher IDs enter the public tree. The quoted regex
        # preserves its repetition braces when Nginx tokenizes this directive.
        if ($uri !~ "^/sites/[a-f0-9]{32}(/|$)") {
            return 404;
        }
        alias /srv/agent-cloud/published/;
        index index.html;
        autoindex off;
        disable_symlinks on;
    }

    # Short, stable names are host-owned links to immutable snapshots. Named
    # captures survive index.html's internal redirect without numeric capture
    # collisions. Reserved service paths never enter either public alias.
    location ~ "^/(?!(?:api|sites|static|assets|private|admin|settings|workspace|workspaces|data|backups|runs|sandboxes|health|login|logout|favicon|signup|status|config|published)(?:/|$))(?<short_slug>[a-z0-9]{4,10})/(?<short_asset>.*)$" {
        alias /srv/agent-cloud/published-short/$short_slug/$short_asset;
        index index.html;
        autoindex off;
        disable_symlinks if_not_owner;
        etag off;
        if_modified_since off;
        # A stable URL changes on release. Always fetch its current snapshot;
        # redeclare the two inherited headers because add_header overrides them.
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~ "^/(?!(?:api|sites|static|assets|private|admin|settings|workspace|workspaces|data|backups|runs|sandboxes|health|login|logout|favicon|signup|status|config|published)$)(?<short_redirect>[a-z0-9]{4,10})$" {
        if (!-d /srv/agent-cloud/published-short/$short_redirect) {
            return 404;
        }
        return 308 /$short_redirect/$is_args$args;
    }

    # No login, API, model proxy, tenant filesystem or configuration access.
    location / {
        return 404;
    }
}
